# Startar hela Homecontrol: docker compose up
# Alla avbilder finns för linux/amd64 och linux/arm64 (t.ex. Raspberry Pi 4/5).
# Hemligheter och inställningar läses från .env (kopiera .env.example).

services:
  core:
    # Färdig avbild från releasen (amd64 och arm64). release-please byter
    # versionen vid varje release. Finns avbilden inte att hämta byggs den
    # på datorn från koden i repot; docker compose up --build bygger alltid själv.
    image: ghcr.io/yxhfr/homecontrol:0.2.1 # x-release-please-version
    build:
      context: .
      dockerfile: core/Dockerfile
    restart: unless-stopped
    # Kärnan delar datorns nätverk, så att den hittar rumskorten med mDNS
    # (multicast når inte in i Dockers eget nät). Därför lyssnar den själv på
    # BIND_ADDRESS och WEB_PORT, och når inte de andra tjänsterna med deras
    # namn: databasen nås genom en socket i en delad volym, och övriga
    # tjänster genom datorns egen adress.
    network_mode: host
    environment:
      HOMECONTROL_HOST: ${BIND_ADDRESS:-0.0.0.0}
      HOMECONTROL_PORT: ${WEB_PORT:-8000}
      HOMECONTROL_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # Hemmodellen och historiken sparas i databasen. Kärnan ansluter med en
      # egen roll som bara får läsa och skriva i tabellerna; db-setup skapar
      # och uppdaterar dem. Lösenordet läses från PGPASSWORD.
      HOMECONTROL_DATABASE: host=/var/run/postgresql dbname=homecontrol user=homecontrol_core require_auth=scram-sha-256
      HOMECONTROL_PREPARE_DATABASE: "false"
      # Kärnans egen kopia av hemmet. Svarar inte databasen vid start används
      # kopian, så att lamporna styrs ändå (se README).
      HOMECONTROL_HOME_COPY: /var/lib/homecontrol/hem.json
      PGPASSWORD: ${CORE_DATABASE_PASSWORD:?CORE_DATABASE_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      # Rumskortens nycklar räknas fram ur den här. Tom: inga kort ansluts.
      HOMECONTROL_ESPHOME_SECRET: ${ESPHOME_SECRET:-}
      # Zigbee-lamporna styrs genom Zigbee2MQTT på MQTT-brokern. Kärnan delar
      # datorns nätverk (se network_mode ovan) och når brokern där Mosquitto
      # publicerar sin port: på BIND_ADDRESS, eller 127.0.0.1 om den inte är satt.
      HOMECONTROL_MQTT_HOST: ${BIND_ADDRESS:-127.0.0.1}
      HOMECONTROL_MQTT_PORT: ${MQTT_PORT:-1883}
      # Kärnans egen MQTT-användare får bara det den behöver av Zigbee2MQTT:s
      # ämnen (mosquitto/acl).
      HOMECONTROL_MQTT_USER: homecontrol_core
      HOMECONTROL_MQTT_PASSWORD: ${MQTT_CORE_PASSWORD:?MQTT_CORE_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      # Dörrklockan (valfri, se README). Avstängd så länge DOORBELL_NTFY_TOPIC är tom.
      HOMECONTROL_DOORBELL_NTFY_TOPIC: ${DOORBELL_NTFY_TOPIC:-}
      HOMECONTROL_DOORBELL_NTFY_URL: ${DOORBELL_NTFY_URL:-}
      HOMECONTROL_DOORBELL_NTFY_TOKEN: ${DOORBELL_NTFY_TOKEN:-}
      HOMECONTROL_DOORBELL_CAMERA_HOST: ${DOORBELL_CAMERA_HOST:-}
      HOMECONTROL_DOORBELL_CAMERA_KEY: ${DOORBELL_CAMERA_KEY:-}
      HOMECONTROL_DOORBELL_SPEAKER_HOST: ${DOORBELL_SPEAKER_HOST:-}
      HOMECONTROL_DOORBELL_SPEAKER_VOLUME: ${DOORBELL_SPEAKER_VOLUME:-}
      HOMECONTROL_DOORBELL_MEDIA_HOST: ${DOORBELL_MEDIA_HOST:-}
      HOMECONTROL_DOORBELL_LAMP: ${DOORBELL_LAMP:-}
      # En egen ljudfil måste också monteras i containern (se README).
      HOMECONTROL_DOORBELL_SOUND_FILE: ${DOORBELL_SOUND_FILE:-}
    volumes:
      # Skrivskyddad, så att kärnan inte kan lägga en egen socket i stället
      # för databasens.
      - db-socket:/var/run/postgresql:ro
      # Bara kärnan har den här volymen, och bara kärnans användare kan läsa kopian.
      - core-data:/var/lib/homecontrol
    # Kärnan startar när db-setup har lyckats. Svarar inte databasen alls
    # lyckas db-setup ändå, och kärnan startar med sin kopia av hemmet.
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Skapar och uppdaterar databasens tabeller, ställer in hur länge historiken
  # sparas och ger kärnans roll (homecontrol_core) rätt att läsa och skriva.
  # Ansluter som databasens ägare och avslutas sedan, så att ägarens lösenord
  # aldrig finns hos den kärna som är igång. Skapar kärnans roll om den saknas,
  # så att en databas från en tidigare version uppgraderas med datan kvar.
  db-setup:
    image: ghcr.io/yxhfr/homecontrol:0.2.1 # x-release-please-version
    build:
      context: .
      dockerfile: core/Dockerfile
    command: ["homecontrol", "förbered-databasen"]
    restart: "no"
    # Behöver inget nätverk: databasen nås genom socketen i den delade volymen.
    network_mode: none
    environment:
      # require_auth: lösenordet skickas aldrig i klartext, inte ens till en falsk databas.
      HOMECONTROL_DATABASE: host=/var/run/postgresql dbname=homecontrol user=homecontrol require_auth=scram-sha-256
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas – kopiera .env.example till .env och fyll i}
      HOMECONTROL_CORE_DATABASE_PASSWORD: ${CORE_DATABASE_PASSWORD:?CORE_DATABASE_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      # Hur länge historiken sparas (se README). Tomt betyder utan tidsgräns.
      HOMECONTROL_HISTORY_FULL_HOURS: ${HISTORY_FULL_HOURS:-24}
      HOMECONTROL_HISTORY_KEEP_DAYS: ${HISTORY_KEEP_DAYS:-}
    volumes:
      - db-socket:/var/run/postgresql
    # Avbildens egen hälsokontroll gäller kärnans webbsida, som inte finns här.
    healthcheck:
      disable: true
    # Startas även när databasen inte kommer igång. Svarar den inte alls
    # avslutas db-setup utan fel, så att kärnan kan starta med sin kopia av
    # hemmet. Alla andra fel (till exempel fel lösenord eller en ogiltig
    # inställning för historiken) stoppar kärnan som vanligt.
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    # Lyssnar bara på socketen och kräver lösenord för alla inloggningar
    # (se postgres/pg_hba.conf).
    command: ["postgres", "-c", "listen_addresses=", "-c", "hba_file=/homecontrol/pg_hba.conf"]
    environment:
      POSTGRES_DB: homecontrol
      POSTGRES_USER: homecontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD saknas – kopiera .env.example till .env och fyll i}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/homecontrol/pg_hba.conf:ro
      # Databasens socket delas med kärnan. Databasen publiceras inte på någon port.
      - db-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U homecontrol -d homecontrol"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/homecontrol/entrypoint.sh"]
    command: ["mosquitto", "-c", "/homecontrol/mosquitto.conf"]
    # Kärnan, Zigbee2MQTT, dörrklockan och hälsokontrollen har var sin användare.
    # mosquitto/acl bestämmer vilka ämnen var och en får läsa och skriva.
    environment:
      MQTT_CORE_PASSWORD: ${MQTT_CORE_PASSWORD:?MQTT_CORE_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      MQTT_ZIGBEE2MQTT_PASSWORD: ${MQTT_ZIGBEE2MQTT_PASSWORD:?MQTT_ZIGBEE2MQTT_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      # Dörrklockans egen användare. Tom: ingen dörrklocka kan logga in.
      MQTT_DOORBELL_PASSWORD: ${MQTT_DOORBELL_PASSWORD:-}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/homecontrol/mosquitto.conf:ro
      - ./mosquitto/acl:/homecontrol/acl:ro
      - ./mosquitto/entrypoint.sh:/homecontrol/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        # Användaren och lösenordet läses från en fil som entrypoint.sh skapar.
        - mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.14.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # Vid första start visas en guide på Zigbee2MQTT-porten där du väljer
      # adaptertyp. MQTT är redan ifyllt härifrån.
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      # Zigbee2MQTT:s egen MQTT-användare får bara sina egna ämnen (mosquitto/acl).
      ZIGBEE2MQTT_CONFIG_MQTT_USER: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_ZIGBEE2MQTT_PASSWORD:?MQTT_ZIGBEE2MQTT_PASSWORD saknas – kopiera raden från .env.example till .env och fyll i}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE_SERIAL_PORT:-/dev/zigbee}
      # Zigbee2MQTT berättar när en lampa slutar svara, så att kärnan kan visa det.
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
      # Webbsidan kräver inloggning med den här nyckeln.
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${ZIGBEE2MQTT_AUTH_TOKEN:?ZIGBEE2MQTT_AUTH_TOKEN saknas – kopiera .env.example till .env och fyll i}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ZIGBEE2MQTT_PORT:-8080}:8080"
    devices:
      # Utan USB-adapter pekar detta på /dev/null; Zigbee2MQTT startar då
      # men kan inte prata med några lampor förrän ZIGBEE_ADAPTER är satt.
      - "${ZIGBEE_ADAPTER:-/dev/null}:/dev/zigbee"
    volumes:
      - zigbee2mqtt-data:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy

volumes:
  core-data:
  db-data:
  db-socket:
  mosquitto-data:
  zigbee2mqtt-data:
