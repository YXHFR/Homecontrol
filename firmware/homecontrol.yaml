# Homecontrol – firmware för ett rumskort (ESP32-S3 med extern antenn).
#
# Konfigurationen är Apache-2.0. Den byggda firmware-binären innehåller
# ESPectre och ESPHome:s C++-kod och blir därför GPL-3.0 (se firmware/README.md).
#
# Kortet innehåller inga hemligheter:
#   - Wi-Fi ställs in efter installationen via Improv över USB, direkt i
#     webbinstalleraren.
#   - API:t är krypterat. Nyckeln skapas av kärnan och skickas till
#     kortet vid första anslutningen. Den sparas i kortets flash.
#   - Uppdateringar hämtas av kortet självt från webbinstalleraren över
#     https, och bara när kärnan ber om det.
#
# Bygg för ett rum:
#   esphome -s rum kok compile firmware/homecontrol.yaml
#
# Rumsnamnet får bara innehålla a–z, 0–9 och bindestreck (blir värdnamnet
# homecontrol-<rum>).

substitutions:
  rum: rum
  firmware_version: dev
  # Var kortet hämtar uppdateringar (webbinstalleraren). Den är inte
  # publicerad på webben än, så tills dess hittar kortet inga uppdateringar.
  # Adressen innehåller GitHub-kontots namn. Byts namnet kan någon annan ta
  # det och skicka firmware till korten, så kontot får inte byta namn.
  update_source: https://yxhfr.github.io/Homecontrol
  # LD2450 (radar) på hårdvaru-UART.
  ld2450_tx_pin: GPIO17
  ld2450_rx_pin: GPIO18
  # BH1750 (ljus) på I²C.
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

esphome:
  name: homecontrol-${rum}
  friendly_name: Homecontrol ${rum}
  # ESPHome-versionen låses i firmware/requirements.txt. min_version gör att
  # en äldre ESPHome säger ifrån direkt.
  min_version: 2026.9.1
  project:
    name: yxhfr.homecontrol
    version: ${firmware_version}

esp32:
  variant: ESP32S3
  board: esp32-s3-devkitc-1
  # 4 MB räcker och fungerar på alla ESP32-S3-moduler.
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # Bluetooth delar radio med Wi-Fi och stör CSI-mätningen.
      CONFIG_BT_ENABLED: n
  # Uttryckligen ESP-IDF, så att byggets sökväg till firmware-filen inte flyttar sig.
  toolchain: esp-idf

# ESPectre (GPL-3.0) låst på en exakt commit (taggen 3.0.0).
external_components:
  - source:
      type: git
      url: https://github.com/francescopace/espectre
      ref: 12fce9354d3506290e70a853a4f22866f0e987ef
      path: src/cpp/frontend/esphome/components
    components: [espectre]
    refresh: never

logger:
  level: INFO

debug:
  update_interval: 60s

wifi:
  # Inga uppgifter här. Nätet ställs in med Improv över USB och sparas i
  # kortets flash.
  # Strömsparläget stängs av: det ger luckor i CSI-mätningen och fördröjning.
  power_save_mode: none

# Medvetet utan egen åtkomstpunkt och captive portal. ESPHome:s captive
# portal tar med firmwareuppladdning utan lösenord, och åtkomstpunkten
# startar av sig själv när Wi-Fi försvinner. Då skulle vem som helst i
# närheten kunna byta firmware.

# Wi-Fi ställs in över USB (samma port som loggen).
improv_serial:

api:
  encryption: {}
  # Starta inte om kortet när kärnan är borta en stund (standard är 15 min).
  # En omstart nollställer radarn och CSI-kalibreringen.
  reboot_timeout: 0s

# Uppdatering över nätverket utan lösenord: kortet tar inte emot någon
# firmware, utan hämtar den själv från update_source över https och
# kontrollerar md5-summan. Det sker bara när någon trycker på "Install" på
# Firmware-entiteten via det krypterade API:t (kärnan frågar användaren).
http_request:
  verify_ssl: true
  # Följ inga omdirigeringar, så att en hämtning aldrig hamnar på vanlig http.
  follow_redirects: false

ota:
  - platform: http_request

update:
  - platform: http_request
    name: Firmware
    source: ${update_source}/manifest-${rum}.json
    update_interval: 6h

uart:
  id: ld2450_uart
  tx_pin: ${ld2450_tx_pin}
  rx_pin: ${ld2450_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  # Radarn skickar 30 byte 10 gånger per sekund (300 byte/s). 512 byte ger
  # marginal om loopen dröjer en stund.
  rx_buffer_size: 512

ld2450:
  id: radar
  uart_id: ld2450_uart
  # Varje ram från radarn håller "Radar Online" på. Se binary_sensor nedan.
  on_data:
    - binary_sensor.template.publish:
        id: radar_online
        state: true
    - script.execute: radar_watchdog

script:
  # Släcker "Radar Online" om ingen ram kommit på 3 sekunder (kabel eller
  # ström borta). Annars kan "Radar Presence" fastna på.
  - id: radar_watchdog
    mode: restart
    then:
      - delay: 3s
      - binary_sensor.template.publish:
          id: radar_online
          state: false

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  frequency: 100kHz

espectre:
  id: csi
  # Ingen egen HTTP-server: allt går via det krypterade API:t.
  direct_api: false
  traffic_generator_mode: ping
  evaluation_interval_ms: 250
  motion_sensor:
    name: CSI Motion
  movement_sensor:
    name: CSI Movement Score
  calibration_active_sensor:
    name: CSI Calibrating
  recalibrate_button:
    name: CSI Recalibrate

# Radarns sensorer har som standard ett filter som stryper till 1 gång per
# sekund. "filters: []" tar bort det så att målen kommer i radarns takt
# (cirka 10 Hz). Värden skickas bara när de ändras.
sensor:
  - platform: ld2450
    ld2450_id: radar
    target_count:
      name: Radar Target Count
      filters: []
    target_1:
      x:
        name: Radar Target 1 X
        filters: []
      y:
        name: Radar Target 1 Y
        filters: []
      speed:
        name: Radar Target 1 Speed
        filters: []
    target_2:
      x:
        name: Radar Target 2 X
        filters: []
      y:
        name: Radar Target 2 Y
        filters: []
      speed:
        name: Radar Target 2 Speed
        filters: []
    target_3:
      x:
        name: Radar Target 3 X
        filters: []
      y:
        name: Radar Target 3 Y
        filters: []
      speed:
        name: Radar Target 3 Speed
        filters: []

  - platform: bh1750
    name: Illuminance
    update_interval: 5s

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

  # Drifttid och minne visar om kortet startar om eller läcker minne
  # (används i hårdvarutestet).
  - platform: uptime
    name: Uptime
    update_interval: 60s

  - platform: debug
    free:
      name: Free Heap
    loop_time:
      name: Loop Time

binary_sensor:
  - platform: ld2450
    ld2450_id: radar
    has_target:
      name: Radar Presence
      filters: []

  - platform: template
    id: radar_online
    name: Radar Online
    device_class: connectivity
    entity_category: diagnostic

text_sensor:
  - platform: ld2450
    ld2450_id: radar
    version:
      name: Radar Firmware

  - platform: template
    name: Firmware Version
    entity_category: diagnostic
    lambda: return {ESPHOME_PROJECT_VERSION};
    update_interval: never

  - platform: version
    name: ESPHome Version
    hide_timestamp: true
