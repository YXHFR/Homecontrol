# Homecontrol – firmware för ett rumskort (ESP32-S3 med extern antenn) med
# radarn LD2450. Varianten med LD2461 är homecontrol-ld2461.yaml. Allt som är
# lika på båda finns i common.yaml.
#
# Konfigurationen är Apache-2.0. Den byggda firmware-binären innehåller
# ESPectre och ESPHome:s C++-kod och blir därför GPL-3.0 (se firmware/README.md).
#
# Kortet innehåller inga hemligheter:
#   - Wi-Fi ställs in efter installationen via Improv över USB, direkt i
#     webbinstalleraren.
#   - API:t är krypterat. Nyckeln skapas av kärnan och skickas till
#     kortet vid första anslutningen. Den sparas i kortets flash.
#   - Uppdateringar hämtas av kortet självt från webbinstalleraren över
#     https, och bara när kärnan ber om det.
#
# Bygg för ett rum:
#   esphome -s rum kok compile firmware/homecontrol.yaml
#
# Rumsnamnet får bara innehålla a–z, 0–9 och bindestreck (blir värdnamnet
# homecontrol-<rum>).

substitutions:
  rum: rum
  firmware_version: dev
  # Var kortet hämtar uppdateringar (webbinstalleraren på Cloudflare). CI
  # sätter den riktiga adressen från repots variabel INSTALLER_URL (se
  # .github/workflows/firmware.yml). Domänen .invalid finns aldrig, så ett
  # kort som byggs utan adressen hittar inga uppdateringar.
  update_source: https://homecontrol-installer.invalid
  # LD2450 (radar) på hårdvaru-UART.
  ld2450_tx_pin: GPIO17
  ld2450_rx_pin: GPIO18
  # BH1750 (ljus) på I²C.
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

packages:
  common: !include common.yaml

update:
  - platform: http_request
    name: Firmware
    source: ${update_source}/manifest-${rum}.json
    update_interval: 6h

uart:
  id: ld2450_uart
  tx_pin: ${ld2450_tx_pin}
  rx_pin: ${ld2450_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  # Radarn skickar 30 byte 10 gånger per sekund (300 byte/s). 512 byte ger
  # marginal om loopen dröjer en stund.
  rx_buffer_size: 512

ld2450:
  id: radar
  uart_id: ld2450_uart
  # Varje ram från radarn håller "Radar Online" på (se common.yaml).
  on_data:
    - binary_sensor.template.publish:
        id: radar_online
        state: true
    - script.execute: radar_watchdog

# Radarns sensorer har som standard ett filter som stryper till 1 gång per
# sekund. "filters: []" tar bort det så att målen kommer i radarns takt
# (cirka 10 Hz). Värden skickas bara när de ändras.
sensor:
  - platform: ld2450
    ld2450_id: radar
    target_count:
      name: Radar Target Count
      filters: []
    target_1:
      x:
        name: Radar Target 1 X
        filters: []
      y:
        name: Radar Target 1 Y
        filters: []
      speed:
        name: Radar Target 1 Speed
        filters: []
    target_2:
      x:
        name: Radar Target 2 X
        filters: []
      y:
        name: Radar Target 2 Y
        filters: []
      speed:
        name: Radar Target 2 Speed
        filters: []
    target_3:
      x:
        name: Radar Target 3 X
        filters: []
      y:
        name: Radar Target 3 Y
        filters: []
      speed:
        name: Radar Target 3 Speed
        filters: []

binary_sensor:
  - platform: ld2450
    ld2450_id: radar
    has_target:
      name: Radar Presence
      filters: []

text_sensor:
  - platform: ld2450
    ld2450_id: radar
    version:
      name: Radar Firmware
