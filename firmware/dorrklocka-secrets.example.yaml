# Hemligheterna till dörrklockan (dorrklocka.yaml). Kopiera till secrets.yaml
# i samma mapp och fyll i; secrets.yaml är gitignorerad och får aldrig committas.
#   cp firmware/dorrklocka-secrets.example.yaml firmware/secrets.yaml

wifi_ssid: byt-mig
wifi_password: byt-mig
# Datorns IP-adress i hemnätet, där Mosquitto lyssnar (BIND_ADDRESS i .env).
mqtt_broker: 192.168.1.20
# Samma som MQTT_DOORBELL_PASSWORD i .env.
mqtt_password: byt-mig
# Samma som DOORBELL_CAMERA_KEY i .env. Skapa med:  openssl rand -base64 32
# Samma nyckel skyddar också uppdateringar över nätverket.
api_key: byt-mig
