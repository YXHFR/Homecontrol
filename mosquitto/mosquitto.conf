# Mosquitto för Homecontrol. Inloggning krävs alltid. Användarna och
# lösenorden kommer från .env och skrivs till lösenordsfilen vid start,
# och acl bestämmer vad varje användare får läsa och skriva.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
