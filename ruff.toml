# Gemensam lint- och formatinställning för all Python i repot.
line-length = 100
target-version = "py314"
# Skripten körs också med systemets python3 (till exempel i firmware-flödet med 3.13),
# så de ska fortsätta fungera med 3.13.
per-file-target-version = { "scripts/**" = "py313" }
# LD2461-komponenten är tagen från ett annat projekt och följer dess stil
# (se firmware/components/ld2461/README.md).
extend-exclude = ["firmware/components"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Svensk text använder tankstreck (–), det är avsiktligt.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S104", "S603", "S607"]
# Skriptet anropar git med fasta argument.
"scripts/classify_change.py" = ["S603", "S607"]

[lint.isort]
known-first-party = ["homecontrol", "classify_change", "scenario", "homes", "fake_cards"]
