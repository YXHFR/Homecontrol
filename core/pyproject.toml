[project]
name = "homecontrol"
version = "0.1.0"
description = "Närvarostyrd belysning – kärnan"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
homecontrol = "homecontrol.__main__:main"

[tool.mypy]
strict = true
files = ["src", "tests", "../scripts"]
explicit_package_bases = true
mypy_path = "src:../scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
