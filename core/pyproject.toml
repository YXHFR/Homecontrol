[project]
name = "homecontrol"
version = "0.1.0"
description = "Närvarostyrd belysning – kärnan"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aioesphomeapi>=46.12.1",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
    "websockets>=15",
    "zeroconf>=0.151.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
homecontrol = "homecontrol.__main__:main"

# Skripten i ../scripts använder bara standardbiblioteket men typkontrolleras
# och testas med kärnans verktyg, så att repot bara har en Python-miljö.
[tool.mypy]
strict = true
files = ["src", "tests", "../scripts"]
explicit_package_bases = true
mypy_path = "src:tests:../scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scenarioramverket (tests/scenario.py) importeras av testerna.
pythonpath = ["tests"]
