name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Kärnan (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .. && uv run ruff format --check ..
      - name: Typkontroll
        run: uv run mypy
      - name: Tester
        run: uv run pytest tests ../scripts/tests

  web:
    name: Webbgränssnittet (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: Bygg
        run: npm run build

  gitleaks:
    name: Hemligheter (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installera gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Sök efter hemligheter i hela historiken
        run: ./gitleaks git --no-banner --redact --verbose

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skapa .env med testlösenord
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^MQTT_PASSWORD=.*/MQTT_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Starta alla tjänster
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Kontrollera kärnan och webbgränssnittet
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<title>Homecontrol</title>'
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
      - name: Visa loggar
        if: failure()
        run: docker compose logs
      - name: Stäng ner
        if: always()
        run: docker compose down --volumes

  multiarch:
    name: Bygg kärnan för amd64 och arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
