name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Kärnan (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    services:
      # Samma databas som i compose.yaml, för testerna av hemmodellen.
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_DB: homecontrol_test
          POSTGRES_USER: homecontrol
          # Databasen finns bara under testkörningen, så den behöver inget lösenord.
          POSTGRES_HOST_AUTH_METHOD: trust
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U homecontrol -d homecontrol_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HOMECONTROL_TEST_DATABASE: host=localhost dbname=homecontrol_test user=homecontrol
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .. && uv run ruff format --check ..
      - name: Typkontroll
        run: uv run mypy
      - name: Tester
        run: uv run pytest tests ../scripts/tests
      # Firmware-flödet kör skripten med Python 3.13, så de testas även där.
      - name: Skripten med Python 3.13
        run: uv run --no-project --python 3.13 --with pytest pytest ../scripts/tests

  web:
    name: Webbgränssnittet (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: Bygg
        run: npm run build

  e2e:
    name: Webbläsartest (kartredigeraren)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      # Kärnan sparar i en riktig databas, som i compose.yaml.
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_DB: homecontrol_e2e
          POSTGRES_USER: homecontrol
          # Databasen finns bara under testkörningen, så den behöver inget lösenord.
          POSTGRES_HOST_AUTH_METHOD: trust
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U homecontrol -d homecontrol_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HOMECONTROL_DATABASE: host=localhost dbname=homecontrol_e2e user=homecontrol
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: uv sync --frozen --project ../core
      - name: Installera Chromium
        run: npx playwright install --with-deps chromium
      - name: Webbläsartester
        run: npm run test:e2e
      - name: Spara rapporten om något gick fel
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  gitleaks:
    name: Hemligheter (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installera gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Sök efter hemligheter i hela historiken
        run: ./gitleaks git --no-banner --redact --verbose

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skapa .env med testlösenord
        run: |
          cp .env.example .env
          for name in POSTGRES_PASSWORD CORE_DATABASE_PASSWORD MQTT_CORE_PASSWORD \
              MQTT_ZIGBEE2MQTT_PASSWORD ZIGBEE2MQTT_AUTH_TOKEN; do
            sed -i "s/^${name}=.*/${name}=$(openssl rand -hex 16)/" .env
          done
          if grep -q byt-mig .env; then echo "Ett lösenord i .env.example fylls inte i här"; exit 1; fi
      - name: Starta alla tjänster
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Kontrollera kärnan och webbgränssnittet
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<title>Homecontrol</title>'
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
      - name: Kärnan ansluter till databasen med en egen roll utan superanvändarrättigheter
        run: |
          docker compose exec -T core python - <<'EOF'
          import psycopg

          with psycopg.connect("host=/var/run/postgresql dbname=homecontrol user=homecontrol_core") as conn:
              row = conn.execute(
                  "SELECT current_user, rolsuper, rolcreaterole, rolcreatedb"
                  " FROM pg_roles WHERE rolname = current_user"
              ).fetchone()
              assert row == ("homecontrol_core", False, False, False), row
          try:
              # Databasens ägare, med kärnans lösenord: ska nekas.
              psycopg.connect("host=/var/run/postgresql dbname=homecontrol user=homecontrol")
          except psycopg.OperationalError:
              pass
          else:
              raise AssertionError("kärnan kom in som databasens ägare")
          EOF
      - name: Kärnan och Zigbee2MQTT har var sin MQTT-användare med ACL
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T -e CORE="$MQTT_CORE_PASSWORD" -e Z2M="$MQTT_ZIGBEE2MQTT_PASSWORD" mosquitto sh -eu <<'EOF'
          # Kärnan läser det Zigbee2MQTT skriver.
          mosquitto_sub -h 127.0.0.1 -u homecontrol -P "$CORE" -t zigbee2mqtt/ci -C 1 -W 10 > /tmp/fick &
          sleep 2
          mosquitto_pub -h 127.0.0.1 -u zigbee2mqtt -P "$Z2M" -t zigbee2mqtt/ci -m hej
          wait
          test "$(cat /tmp/fick)" = hej
          # Zigbee2MQTT får inte läsa brokerns egna ämnen.
          if mosquitto_sub -h 127.0.0.1 -u zigbee2mqtt -P "$Z2M" -t '$SYS/broker/uptime' -C 1 -W 3; then
            echo "zigbee2mqtt fick läsa \$SYS"; exit 1
          fi
          # Utan lösenord kommer ingen in.
          if mosquitto_sub -h 127.0.0.1 -t zigbee2mqtt/# -C 1 -W 3; then exit 1; fi
          EOF
      - name: Exportera hemmet från databasen och importera det igen
        run: |
          docker compose exec -T core homecontrol exportera > hem.json
          grep -q '"name": "Exempelhemmet"' hem.json
          docker compose exec -T core homecontrol importera - < hem.json
      - name: Visa loggar
        if: failure()
        run: docker compose logs
      - name: Stäng ner
        if: always()
        run: docker compose down --volumes

  multiarch:
    name: Bygg kärnan för amd64 och arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
