name: Firmware

# Validerar och bygger rumskortens firmware, för korten med LD2450
# (firmware/homecontrol.yaml) och med LD2461 (firmware/homecontrol-ld2461.yaml),
# och lägger ihop den till webbinstalleraren, som sparas som artefakten
# "webbinstallerare".
#
# Från main publiceras webbinstalleraren på Cloudflare (Workers med statiska
# filer, firmware/wrangler.jsonc), aldrig från en PR eller en fork.
# Ägaren ställer in det en gång (steg för steg i firmware/README.md,
# avsnittet "Publicera webbinstalleraren"):
#   1. Cloudflare: My Profile -> API Tokens -> Create Token -> mallen
#      "Edit Cloudflare Workers", begränsad till ditt eget konto.
#   2. Account ID: Workers & Pages i Cloudflare -> Account Details.
#   3. GitHub: Settings -> Secrets and variables -> Actions -> fliken Secrets
#      -> New repository secret: CLOUDFLARE_API_TOKEN och CLOUDFLARE_ACCOUNT_ID.
#   4. Efter första publiceringen: samma sida, fliken Variables -> New
#      repository variable: INSTALLER_URL = sidans adress, till exempel
#      https://homecontrol-installer.<ditt-namn>.workers.dev (utan / sist).
#      Korten hämtar uppdateringar därifrån. Kör sedan workflowen igen
#      (Actions -> Firmware -> Run workflow) så att firmware får adressen,
#      och installera om korten en gång över USB.
# Saknas hemligheterna hoppas publiceringen över med en notis, utan fel.
#
# Dörrklockan (firmware/dorrklocka.yaml) valideras och byggs för sig, med
# påhittade hemligheter. Den byggs bara för att visa att den går att bygga;
# ägaren bygger sin egen med sina hemligheter (se firmware/README.md).

on:
  push:
    branches: [main]
    paths:
      - firmware/**
      - scripts/firmware_site.py
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - scripts/firmware_site.py
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  # En PR avbryter sin förra körning. På main körs de i tur och ordning, så
  # att en publicering aldrig avbryts halvvägs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ESP Web Tools läggs på samma sida i stället för att laddas från ett CDN.
  ESP_WEB_TOOLS_VERSION: 10.4.0
  ESP_WEB_TOOLS_SHA256: f18da75335d2f0dca044c4bb052848c0696e7b03cc23d61d8530dd6eba0a9008

jobs:
  validate:
    name: Validera ESPHome-paketet
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - run: pip install --require-hashes -r firmware/requirements.txt
      - name: Firmware att bygga
        id: builds
        run: |
          builds=$(python3 scripts/firmware_site.py builds)
          # I en PR räcker det att bygga ett rum för varje radar.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            builds=$(echo "$builds" | jq -c 'group_by(.radar) | map(.[0])')
          fi
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
      - name: Validera konfigurationen
        # "ci-test" är bara ett rumsnamn för valideringen.
        run: |
          esphome -s rum ci-test config firmware/homecontrol.yaml > resolved-ld2450.yaml
          esphome -s rum ci-test config firmware/homecontrol-ld2461.yaml > resolved-ld2461.yaml
      - name: Kontrollera viktiga inställningar
        run: |
          fail() { echo "::error::$1"; exit 1; }
          grep -qE '^\s+baud_rate: 256000$' resolved-ld2450.yaml || fail "LD2450 ska köra 256000 baud"
          grep -qE '^\s+baud_rate: 9600$' resolved-ld2461.yaml || fail "LD2461 ska köra 9600 baud"
          grep -q 'manifest-ci-test.json$' resolved-ld2450.yaml \
            || fail "LD2450-kortet ska hämta uppdateringar för LD2450"
          grep -q 'manifest-ld2461-ci-test.json$' resolved-ld2461.yaml \
            || fail "LD2461-kortet ska hämta uppdateringar för LD2461"
          for resolved in resolved-ld2450.yaml resolved-ld2461.yaml; do
            ! grep -q throttle "$resolved" || fail "Radarns strypfilter ska vara borttaget ($resolved)"
            ! grep -qE '^(esp32_ble|esp32_ble_tracker|bluetooth_proxy|ble_client):' "$resolved" \
              || fail "Bluetooth ska vara avstängt ($resolved)"
            grep -q 'CONFIG_BT_ENABLED: n' "$resolved" || fail "Bluetooth ska vara avstängt i ESP-IDF ($resolved)"
            grep -qE '^  encryption: \{\}$' "$resolved" \
              || fail "API:t ska vara krypterat utan inbyggd nyckel ($resolved)"
            ! grep -qE '^(web_server|captive_portal):' "$resolved" \
              || fail "Ingen webbserver eller captive portal, de tar emot firmware utan lösenord ($resolved)"
            ! grep -qE '^\s+- platform: (esphome|web_server)$' "$resolved" \
              || fail "OTA får bara hämtas av kortet självt, platform: http_request ($resolved)"
            grep -qE '^\s+verify_ssl: true$' "$resolved" \
              || fail "Uppdateringar ska hämtas med kontrollerat https ($resolved)"
            grep -qE '^\s+follow_redirects: false$' "$resolved" \
              || fail "Uppdateringar ska inte följa omdirigeringar ($resolved)"
            ! grep -qE '^\s+(password|key|psk):' "$resolved" || fail "Hemligheter hör inte hemma i paketet ($resolved)"
          done

  build:
    name: Bygg firmware (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.builds) }}
    env:
      ROOM: ${{ matrix.room }}
      CONFIG: ${{ matrix.config }}
      NAME: ${{ matrix.name }}
      # Webbinstallerarens adress, där korten hämtar uppdateringar (se överst).
      # Bara firmware från main får den; en PR bygger med adressen i YAML-filen.
      INSTALLER_URL: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.INSTALLER_URL || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - run: pip install --require-hashes -r firmware/requirements.txt
      - name: Cacha ESP-IDF och verktyg
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ hashFiles('firmware/requirements.txt') }}
      - name: Bygg
        run: |
          source=()
          if [ -n "$INSTALLER_URL" ]; then
            # Bara https och ett vanligt värdnamn, utan / sist (manifestets
            # sökväg läggs till efter).
            [[ "$INSTALLER_URL" =~ ^https://[a-z0-9.-]+(/[A-Za-z0-9._~-]+)*$ ]] \
              || { echo "::error::INSTALLER_URL ska vara en https-adress utan / sist"; exit 1; }
            source=(-s update_source "$INSTALLER_URL")
          fi
          esphome -s rum "$ROOM" -s firmware_version "git-${GITHUB_SHA::7}" "${source[@]}" \
            compile "firmware/$CONFIG"
          mkdir -p out
          build="firmware/.esphome/build/homecontrol-$ROOM/build"
          cp "$build/firmware.factory.bin" "out/$NAME.factory.bin"
          cp "$build/firmware.ota.bin" "out/$NAME.ota.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  doorbell:
    name: Bygg dörrklockan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - run: pip install --require-hashes -r firmware/requirements.txt
      - name: Cacha ESP-IDF och verktyg
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ hashFiles('firmware/requirements.txt') }}
      - name: Påhittade hemligheter
        # Slumpade för varje körning och sparas ingenstans. Byggets firmware används inte.
        run: |
          umask 077
          {
            echo "wifi_ssid: ci"
            echo "wifi_password: $(openssl rand -hex 16)"
            echo "mqtt_broker: 192.0.2.1"
            echo "mqtt_password: $(openssl rand -hex 16)"
            echo "api_key: $(openssl rand -base64 32)"
          } > firmware/secrets.yaml
      - name: Validera konfigurationen
        run: esphome config firmware/dorrklocka.yaml > resolved-dorr.yaml
      - name: Kontrollera integritet och säkerhet
        run: |
          fail() { echo "::error::$1"; exit 1; }
          r=resolved-dorr.yaml
          grep -qE '^  idle_framerate: 0(\.0)?$' "$r" || fail "Kameran ska inte ta bilder när ingen ber om dem"
          ! grep -qE '^(web_server|esp32_camera_web_server|captive_portal):' "$r" \
            || fail "Ingen webbserver: kameran ska bara nås genom kärnan över det krypterade API:t"
          ! grep -qE 'platform: (esp32_camera_web_server|web_server)$' "$r" \
            || fail "Ingen webbserver: kameran ska bara nås genom kärnan över det krypterade API:t"
          ! grep -qE '^(microphone|i2s_audio|voice_assistant):' "$r" || fail "Mikrofonen ska inte användas"
          grep -qE "^    key: !secret 'api_key'$" "$r" || fail "API:t ska vara krypterat med nyckeln i secrets.yaml"
          grep -qE '^  topic_prefix: dorr/klocka$' "$r" || fail "Dörrklockan ska bara skriva under dorr/ (mosquitto/acl)"
          grep -qE '^  log_topic: null$' "$r" || fail "Loggen ska inte skickas över MQTT"
          grep -qE '^  discover_ip: false$' "$r" || fail "Dörrklockan ska inte annonsera sig över MQTT"
          # Alla lösenord och nycklar ska komma från secrets.yaml.
          ! grep -E '^\s+(password|key|psk):' "$r" | grep -v '!secret' || fail "Hemligheter hör inte hemma i konfigurationen"
      - name: Bygg
        run: esphome compile firmware/dorrklocka.yaml

  site:
    name: Bygg webbinstalleraren
    # Bara från main. En PR bygger bara ett rum per radar, och en PR (även från en fork)
    # ska inte kunna ladda upp en installerare som någon tar för den riktiga.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: builds
      - name: Bygg sidan
        run: |
          python3 scripts/firmware_site.py site --builds builds --out site \
            --version "git-${GITHUB_SHA::7}" \
            --source "${{ github.server_url }}/${{ github.repository }}/tree/${GITHUB_SHA}/firmware"
      - name: Lägg till ESP Web Tools
        run: |
          archive="esp-web-tools-${ESP_WEB_TOOLS_VERSION}.tgz"
          curl -sSfLO "https://registry.npmjs.org/esp-web-tools/-/${archive}"
          echo "${ESP_WEB_TOOLS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}"
          cp -r package/dist/web site/esp-web-tools
          cp package/LICENSE site/esp-web-tools/LICENSE
      - name: Lägg till GPL-3.0-licensen
        run: |
          # Samma ESPectre-commit som firmware byggs med.
          ref=$(grep -oP '^\s+ref: \K[0-9a-f]{40}$' firmware/common.yaml)
          curl -sSfL "https://raw.githubusercontent.com/francescopace/espectre/${ref}/LICENSE" \
            -o site/LICENSE-GPL-3.0.txt
      - uses: actions/upload-artifact@v7
        with:
          name: webbinstallerare
          path: site/
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: Publicera webbinstalleraren på Cloudflare
    # Samma villkor som för sidan: bara main i det här repot, aldrig en PR
    # eller en fork. En fork har inte heller hemligheterna.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && github.repository == 'yxhfr/Homecontrol'
    needs: site
    runs-on: ubuntu-latest
    # Hemligheterna kan ligga i den här miljön och begränsas till main
    # (Settings -> Environments), se firmware/README.md.
    environment: cloudflare-installer
    permissions:
      contents: read
    # En publicering i taget, och en pågående avbryts inte.
    concurrency:
      group: cloudflare-installer
      cancel-in-progress: false
    steps:
      - name: Finns Cloudflare-hemligheterna?
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_ACCOUNT" = true ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Webbinstalleraren publicerades inte::CLOUDFLARE_API_TOKEN och CLOUDFLARE_ACCOUNT_ID saknas bland repots secrets. Se firmware/README.md, avsnittet Publicera webbinstalleraren."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: firmware/wrangler.jsonc
          sparse-checkout-cone-mode: false
      - if: steps.secrets.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: webbinstallerare
          path: site
      - if: steps.secrets.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          workingDirectory: firmware
          command: deploy
      - if: steps.secrets.outputs.publish == 'true' && vars.INSTALLER_URL == ''
        run: echo "::notice title=INSTALLER_URL saknas::Webbinstalleraren är publicerad, men korten vet inte var. Lägg in sidans adress som variabeln INSTALLER_URL och kör workflowen igen (se firmware/README.md)."
      - name: Finns den nya versionen på INSTALLER_URL?
        # Korten hämtar från INSTALLER_URL. Visar sidan där inte den version
        # som just publicerades är adressen fel (eller Worker-namnet bytt).
        if: steps.secrets.outputs.publish == 'true' && vars.INSTALLER_URL != ''
        env:
          INSTALLER_URL: ${{ vars.INSTALLER_URL }}
        run: |
          want=$(jq -r .version site/info.json)
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -sSf --proto '=https' --max-redirs 0 "$INSTALLER_URL/info.json" | jq -r .version) || got=""
            [ "$got" = "$want" ] && { echo "Version $want finns på $INSTALLER_URL"; exit 0; }
            sleep 10
          done
          echo "::warning title=INSTALLER_URL visar inte den nya versionen::Väntade $want men fick '${got}' från $INSTALLER_URL. Kontrollera variabeln INSTALLER_URL mot adressen i Cloudflare."
