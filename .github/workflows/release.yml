name: Release

# release-please läser commit-meddelandena (conventional commits) på main och
# håller en PR öppen med nästa version och ändringslistan. När den PR:en
# mergas skapas en tagg och en GitHub Release med ändringslistan, och kärnans
# avbild publiceras på GHCR för amd64 och arm64. Inställningarna finns i
# release-please-config.json. Ingen CHANGELOG-fil skrivs.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release-PR och GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Publicera kärnans avbild (amd64 och arm64)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Avbildens namn
        id: names
        run: |
          # GHCR kräver små bokstäver. compose.yaml pekar på samma namn.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homecontrol"
          {
            echo "tags<<EOF"
            echo "${image}:${VERSION}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: core/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Homecontrol
            org.opencontainers.image.description=Närvarostyrd belysning – kärnan med webbgränssnittet
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
