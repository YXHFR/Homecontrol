# Dependabot föreslår uppdateringar av beroenden en gång i veckan.
# Commit-meddelandena följer conventional commits så att release-please
# kan läsa dem: fix(deps) för det som hamnar i kärnans avbild eller i
# compose.yaml, så att det ger en ny release, och chore(deps) för resten.
version: 2
updates:
  - package-ecosystem: uv
    directory: /core
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
  - package-ecosystem: pip
    directory: /firmware
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      web-dev:
        dependency-type: development
    ignore:
      # jsdom 30 får webbtesterna att fallera. Tas bort när testerna har uppdaterats.
      - dependency-name: jsdom
        versions: ["30.x"]
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # Bara LTS-versioner av Node (jämna nummer). Udda versioner är korttidsversioner.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    ignore:
      # Kärnans egen avbild. Versionen sätts av release-please.
      - dependency-name: ghcr.io/yxhfr/homecontrol
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
