# Vem som får logga in i databasen, och hur. Alla måste ange lösenord, även
# genom socketen som delas med kärnan och db-setup (se compose.yaml).
# Postgres-avbildens egen fil släpper in alla genom socketen utan lösenord,
# och då skulle kärnan kunna logga in som databasens ägare.
#
# TYPE  DATABASE  USER  ADDRESS  METHOD
local   all       all            scram-sha-256
host    all       all   all      scram-sha-256
