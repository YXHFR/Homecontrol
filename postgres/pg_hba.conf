# Vem som får logga in i databasen, och hur. Databasen lyssnar bara på
# socketen som delas med kärnan och db-setup (se compose.yaml), inte på
# nätverket, och alla måste ange lösenord. Postgres-avbildens egen fil
# släpper in alla genom socketen utan lösenord, och då skulle kärnan kunna
# logga in som databasens ägare.
#
# TYPE  DATABASE  USER  METHOD
local   all       all   scram-sha-256
