<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homecontrol</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 832px;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: #222;
      }
      .stage {
        width: 100%;
        max-width: 800px;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin: 12px 0;
      }
      .status {
        color: #666;
      }
      .floors {
        display: flex;
        gap: 8px;
        margin: 0 0 12px;
      }
      .floors button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      .floors button[aria-pressed="true"] {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
