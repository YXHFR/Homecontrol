<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homecontrol</title>
    <style>
      body {
        margin: 0 auto;
        max-width: 832px;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: #222;
      }
      .stage {
        width: 100%;
        max-width: 800px;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin: 12px 0;
      }
      .status {
        color: #666;
      }
      .database-warning {
        padding: 8px 12px;
        border: 1px solid #c62828;
        border-radius: 8px;
        color: #c62828;
      }
      .floors,
      .speeds {
        display: flex;
        gap: 8px;
        margin: 0 0 12px;
      }
      .speeds {
        display: inline-flex;
        margin: 0;
      }
      .persons {
        padding-left: 20px;
      }
      .persons li {
        margin: 4px 0;
      }
      .simulation,
      .cards-panel,
      .calibration {
        margin: 12px 0;
        padding: 0 12px 4px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      .cards li {
        margin: 6px 0;
      }
      .cards li[data-warning="true"] strong {
        color: #c62828;
      }
      .help {
        color: #555;
      }
      .calibration .problem {
        color: #c62828;
      }
      .calibration progress {
        width: 100%;
      }
      .speeds button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .floors button,
      .speeds button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      .floors button[aria-pressed="true"],
      .speeds button[aria-pressed="true"] {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #fff;
      }
      .rooms-now,
      .events {
        padding-left: 20px;
      }
      .rooms-now li {
        margin: 0 0 12px;
      }
      .rooms-now p {
        margin: 2px 0;
      }
      .rooms-now .explanation,
      .events time {
        color: #555;
      }
      .badge.manual {
        padding: 1px 8px;
        border-radius: 8px;
        background: #e3e8fb;
        color: #2f4fb0;
        font-size: 0.9em;
      }
      .lamp-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .lamp-toggle[aria-pressed="true"] {
        background: #ffe98a;
      }
      .pages {
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
      }
      .pages a {
        color: #2f6fed;
      }
      .pages a[aria-current="page"] {
        color: #222;
        font-weight: 600;
        text-decoration: none;
      }
      .door-stream {
        display: block;
        width: 100%;
        max-width: 800px;
        margin-top: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="pages" aria-label="Sidor">
      <a href="#" data-page="live">Livevy</a>
      <a href="#redigera" data-page="editor">Kartredigerare</a>
      <a href="#dorren" data-page="door" hidden>Dörren</a>
    </nav>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
